function identity(){return `<div class="rolepage"><div class="identity"><div><img class="logo" src="../assets/湛知书页新芽徽标.png" alt="湛知"><h1>理解每一次学习。</h1><p class="muted" style="margin-top:16px;font-size:16px">学科 · 学情 · 个性化学习</p><svg class="art" viewBox="0 0 400 160" aria-hidden="true"><path d="M45 115L113 72L181 92L247 39L335 45M113 72L113 132M181 92L247 125M247 39L247 125M335 45L247 125" stroke="#A9C1B6" stroke-width="1.6" fill="none"/>${[[45,115,9],[113,72,13],[181,92,8],[247,39,15],[335,45,9],[113,132,6],[247,125,11]].map(([x,y,r],i)=>`<circle cx="${x}" cy="${y}" r="${r}" stroke="#234C42" fill="${i===3?'#234C42':'white'}" stroke-width="1.5"/>`).join('')}</svg></div><div><h2 style="font-size:24px;margin-bottom:26px">选择身份</h2><button class="choice" onclick="switchRole('teacher')">${ic('teacher',32)}<span class="grow"><strong>教师</strong><br><span class="muted">教学工作台</span></span>${ic('arrow')}</button><button class="choice" onclick="openStudentSelect()">${ic('student',32)}<span class="grow"><strong>学生</strong><br><span class="muted">我的学习空间</span></span>${ic('arrow')}</button><p class="hint" style="margin-top:20px">本地比赛模拟身份</p></div></div></div>`}
function radar(values=[.86,.74,.61,.52,.71,.85],labels=['整式运算','方程求解','实际应用','不等式','运算检验','等式性质']){let cx=250,cy=170,r=115,n=values.length,pt=(i,v)=>[cx+r*v*Math.sin(i*Math.PI*2/n),cy-r*v*Math.cos(i*Math.PI*2/n)],p=(v)=>Array.from({length:n},(_,i)=>pt(i,v).join(',')).join(' '),points=values.map((v,i)=>pt(i,v).join(',')).join(' ');return `<svg class="chart" viewBox="0 0 500 340" role="img" aria-label="观察指标有效得分率雷达图">${[.25,.5,.75,1].map(v=>`<polygon points="${p(v)}" fill="none" stroke="var(--color-border)"/>`).join('')}${labels.map((l,i)=>{let [x,y]=pt(i,1),[lx,ly]=pt(i,1.19);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--color-border)"/><text x="${lx}" y="${ly+5}" text-anchor="${i===0||i===3?'middle':i<3?'start':'end'}">${l}</text>`}).join('')}<polygon points="${points}" fill="var(--color-chart-fill)" stroke="var(--color-primary)" stroke-width="2.2"/>${values.map((v,i)=>{let [x,y]=pt(i,v);return `<circle cx="${x}" cy="${y}" r="4" fill="var(--color-primary)"><title>${labels[i]} ${(v*100).toFixed(0)}%</title></circle>`}).join('')}<text x="${cx+6}" y="${cy-3}">0</text><text x="${cx+6}" y="${cy-r-4}">100%</text></svg>`}

const findings=()=>`<div class="listrow"><div class="grow"><h3>去括号时的符号处理</h3><p>负号未正确分配至括号内各项。</p><small>整式运算 · 具体错误</small></div>${link('查看依据',"evidence()")}</div><div class="listrow"><div class="grow"><h3>实际问题建模</h3><p>当前独立作答证据不足，需要补充观察。</p></div>${link('查看依据',"evidence('metric')")}</div>`;

span><button class="primary" disabled>导出正式成果 ZIP</button></div>`))}
function showFiles(e){$('#fileList').textContent=[...e.files].map(f=>f.name).join('、')}
function chat(){let isT=role==='teacher';return head('AI 对话',isT?btn(ic('settings',16)+' 模型设置',"modelDialog()"):'')+`<div class="chatlayout"><aside class="history">${btn('+ 新对话',"chatSent=false;confirmed=false;render()",'primary')}<h3 style="margin-top:28px">最近对话</h3>${btn(isT?'S01 学习安排':'去括号时的负号',"render()",'active')}${btn('课程知识查询',"demoNotice('历史会话')")}</aside><div class="messages"><div class="row between"><span class="pill">${isT?'学生 '+selectedStudent+' · 学习方案':'基础练习 · 去括号'}</span><small>当前上下文</small></div><div class="bubble">${isT?'这个学生的练习安排可以更精简一些吗？':'括号前的负号应该怎么处理？'}</div><div class="reply"><div class="row"><img src="../assets/湛知书页新芽徽标.png" alt="湛知" style="width:32px;height:32px;object-fit:contain"><strong>湛知</strong></div>${isT?`<details style="margin:16px 0"><summary class="muted">查询学情、读取方案、准备调整（示意）</summary><div class="stack" style="padding:12px 0"><span class="good">✓ 查询学生学情</span><span class="good">✓ 读取当前计划</span><span class="good">✓ 准备候选方案</span></div></details><p>保留针对符号错误的微课堂，减少重复计算练习。当前证据仍支持保留一次独立检查。${link('查看依据',"evidence('derived')")}</p><div class="confirm"><h3>调整预览</h3><table><thead><tr><th>活动</th><th>修改前</th><th>修改后</th></tr></thead><tbody><tr><td>微课堂</td><td>1节</td><td>1节</td></tr><tr><td>练习题</td><td>5道</td><td>3道</td></tr></tbody></table><small>学生 ${selectedStudent} · 确认后进入完整审核</small><div class="row" style="justify-content:flex-end">${confirmed?status('已确认（原型）','warn'):btn('暂不修改',"demoNotice('已拒绝（原型）')")+btn('确认调整',"confirmed=true;render()",'primary')}</div></div>`:`<p>把括号前的负号看作系数 −1。试着让它分别乘到括号里的每一项，再检查符号。</p><p>你可以先写出第一步，我再帮你检查。</p>`}</div>${chatSent?`<div class="bubble">${esc(chatSent)}</div><div class="reply muted">这是交互示例，不连接模型或业务数据。</div>`:''}<div class="composer"><textarea id="chatInput" placeholder="输入你的问题…" rows="3"></textarea><div class="row between" style="margin-top:8px"><small>当前范围内对话</small>${btn('发送 →',"let e=document.getElementById('chatInput');if(e.value.trim()){chatSent=e.value;render()}",'primary')}</div></div></div></div>`}
function modal(title,body,foot='',cls=''){modalBack=document.activeElement;$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="dialog ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="dhead"><h2>${title}</h2>${btn(ic('x'),"closeModal()",'icon')}</div><div class="dbody">${body}</div>${foot?`<div class="dfoot">${foot}</div>`:''}</section></div>`;$('#modal button')?.focus()}function closeModal(){if($('#modal').innerHTML){$('#modal').innerHTML='';modalBack?.focus?.();modalBack=null}}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('.dialog')){let els=[...$('.dialog').querySelectorAll('button:not(:disabled),input:not(:disabled),select,textarea,[tabindex="0"]')];if(els.length&&e.shiftKey&&document.activeElement===els[0]){e.preventDefault();els.at(-1).focus()}else if(els.length&&!e.shiftKey&&document.activeElement===els.at(-1)){e.preventDefault();els[0].focus()}}});
function evidence(kind='record'){let b=kind==='metric'?`<h3>有效得分率</h3><div class="num">72.4%</div><p class="muted">合成统计示意 · 正式结果须附分子、分母与范围</p>${trend()}`:kind==='curriculum'?`<h3>去括号法则</h3><p>乘法分配律决定括号内各项的系数变换。</p><div class="line" style="margin:20px 0"></div><p>教材出处及页码由 A 的正式来源提供。</p>`:kind==='derived'?`<h3>学习建议依据</h3><p>具体符号错误及练习表现；仍需保留独立检查。</p>${link('查看相关作答',"evidence()")}`:`<h3>题目</h3><div class="math">化简 −2(x−3)+x</div><div class="section"><h3>学生实际作答（示意）</h3><div class="math">−2x−6+x = −x−6</div></div>${role==='teacher'?`<div class="section"><h3>评分记录</h3><table><thead><tr><th>评分点</th><th>得分</th></tr></thead><tbody><tr><td>正确去括号</td><td>0/2</td></tr><tr><td>合并同类项</td><td>1/1</td></tr></tbody></table></div>`:''}<h3 style="margin-top:16px">相关诊断</h3><p>负数与括号内负常数相乘时符号处理错误。</p>`;modal('分析依据',`<small>${selectedStudent} · 历史记录 · 合成示意</small><div class="section">${b}</div><details><summary>来源及版本</summary><p class="muted">正式页面显示真实证据引用及历史版本。</p></details>`,'','drawer')}
function editor(){modal('编辑学习方案 · '+selectedStudent,`<div class="two"><div><label>学习目标</label><input value="纠正去括号时的符号错误" style="width:100%;margin:8px 0 18px"><h3>任务组</h3><div id="editableRows">${actRows.map((a,i)=>`<div class="listrow"><span class="index">${i+1}</span><div class="grow"><strong>${a[0]}</strong><p class="muted">${a[1]}</p></div>${i===0?ic('lock',16):btn('↑',"moveRow(this,-1)")+btn('↓',"moveRow(this,1)")+btn('删除',"this.closest('.listrow').remove()")}</div>`).join('')}</div><label>学生学习建议</label><textarea rows="3">先理解负号与分配律，再完成针对性练习。</textarea></div><div class="side"><h3>题库与材料</h3><div class="row" style="margin:12px 0"><input placeholder="搜索题目" style="width:100%"></div><div class="row"><select><option>全部题型</option><option>解答题</option></select><select><option>全部难度</option><option>基础</option></select></div>${['去括号与合并同类项','方程中的分配律','不等式变形'].map(s=>`<div class="listrow"><div class="grow">${s}<br><small>登记题库 · 示例</small></div>${btn('+ 添加',`addActivity('${s}')`)}</div>`).join('')}<div class="section">${btn('通过 AI 协助调整',"closeModal();go('chat')")}</div></div></div>`,`<div>${link('历史版本',"historyDialog()")}</div><div class="row">${btn('取消',"closeModal()")}${btn('检查并发布',"previewEditor()",'primary')}</div>`)}function moveRow(b,d){let r=b.closest('.listrow'),other=d<0?r.previousElementSibling:r.nextElementSibling;if(!other||other.querySelector('svg'))return;let p=r.parentNode;d<0?p.insertBefore(r,other):p.insertBefore(other,r)}function addActivity(s){$('#editableRows').insertAdjacentHTML('beforeend',`<div class="listrow"><span class="index">+</span><div class="grow">${esc(s)}</div><button onclick="this.closest('.listrow').remove()">删除</button></div>`)}function previewEditor(){modal('发布预览',`<h3>修改差异（示意）</h3><p>正式产品由 C 检查历史、材料、版本和答案保护，返回真实预览。</p><div class="note warn" style="margin-top:16px">当前仅为原型，不执行实际发布。</div>`,`<span></span><div class="row">${btn('返回编辑',"editor()")}${btn('确认（原型）',"closeModal()",'primary')}</div>`,'small')}function historyDialog(){modal('学习方案历史',`<div class="listrow"><div class="grow"><h3>当前正式方案</h3><small>已复查，仍适用</small></div>${status('当前')}</div><div class="listrow"><div class="grow"><h3>上一版本</h3><small>历史版本 · 保留已完成记录</small></div>${link('查看差异',"demoNotice('历史差异')")}</div>`,'','small')}
function openAlerts(){modal('待处理事项',`${[['知识关联待核验','一道评分点关联尚不明确',"go('curriculum','reviews')"],['学习方案待审核','S08 的新方案需核对材料',"chooseStudent('S08')"],['教师介入提醒','S12 需要进一步观察',"chooseStudent('S12')"]].map(([a,b,c])=>`<div class="listrow"><div class="grow"><h3>${a}</h3><p>${b}</p></div>${link('处理 →',c)}</div>`).join('')}`,'','small')}
function openStudentSelect(){modal('选择学生身份',`<label>模拟学生 <select id="studentSelect" style="width:100%;margin-top:10px">${['S01','S02','S03','S04','S05'].map(s=>`<option>${s}</option>`).join('')}</select></label>`,`<span></span>${btn('进入学习空间',"selectedStudent=$('#studentSelect').value;switchRole('student')",'primary')}`,'small')}
function modelDialog(){modal('模型设置',`<div class="stack"><label>服务地址<input style="width:100%;margin-top:6px" placeholder="https://..."/></label><label>模型名称<input style="width:100%;margin-top:6px" placeholder="模型 ID"/></label><label>API Key<input type="password" style="width:100%;margin-top:6px" placeholder="未配置"/></label><small>原型不会发送或保存密钥。</small></div>`,`<span></span><div class="row">${btn('测试连接',"demoNotice('原型不连接模型')")}${btn('关闭',"closeModal()",'primary')}</div>`,'small')}
function reviewDialog(){modal('知识关联审核',`<h3>去括号评分点关联</h3><p>候选关联需要核验其对应的实际数学操作。</p><textarea rows="3" placeholder="审核原因"></textarea>`,`<span></span><div class="row">${btn('拒绝',"closeModal()")}${btn('通过（原型）',"closeModal()",'primary')}</div>`,'small')}
function demoNotice(t){modal(t,'<p>此为设计参考，不执行真实业务操作。</p>','<span></span>'+btn('关闭',"closeModal()"),'small')}
render();
</script></body></html>
